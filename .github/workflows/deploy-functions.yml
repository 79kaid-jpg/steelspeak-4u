# Tự deploy Edge Functions lên Supabase mỗi khi code function thay đổi trên nhánh main.
# Cần 1 secret trong GitHub: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "saga-core.js"]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bstlbodjjnndmgxhqerf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy
        run: |
          for f in saga ai suggest admin; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt || exit 1
          done
