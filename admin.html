<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SteelSpeak Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14212e;--mut:#5f6f80;--line:#dde3ea;--soft:#eef2f6;--steel:#1f4e79;--steel2:#2f6ea8;--amber:#e3a21a;--good:#1f7a4d;--bad:#c0392b;--warn:#8a5a00;--fd:'Barlow Semi Condensed',system-ui,sans-serif;--fb:'Be Vietnam Pro',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d141b;--card:#152029;--ink:#e6edf3;--mut:#93a4b5;--line:#26343f;--soft:#1b2833;--steel:#6fa8dc;--steel2:#8fbde6;--good:#4cc38a;--bad:#ef7a6c;--warn:#f0c060}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb)}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:.01em}h1{font-size:1.6rem}h2{font-size:1.25rem}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#10283f;color:#dce8f3;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .brand{font:700 1.3rem var(--fd);padding:4px 10px 14px;color:#fff}aside .brand small{display:block;font:500 .75rem var(--fb);color:#9fb6cc}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:inherit;text-align:left;cursor:pointer;min-height:44px}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:#fff;color:#10283f;font-weight:600}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font:700 .75rem/22px var(--fb);text-align:center}
aside .foot{margin-top:auto;font-size:.8rem;color:#9fb6cc;padding:8px 10px}aside .foot a{color:#fff}
main{padding:22px 28px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--mut)}.small{font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:var(--steel);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--steel);border-color:var(--line)}.btn.amber{background:var(--amber);color:#1a1205}.btn.danger{background:none;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn:disabled{opacity:.5;cursor:default}.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--steel2) 50%,transparent);outline-offset:1px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px;width:100%}textarea{resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.85rem}.chip.on{background:var(--steel);color:#fff;border-color:var(--steel)}
table{width:100%;border-collapse:separate;border-spacing:0}th{position:sticky;top:0;background:var(--soft);text-align:left;font:600 .78rem var(--fb);text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:10px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr.dirty td{background:color-mix(in srgb,var(--amber) 10%,transparent)}
td input,td textarea,td select{min-height:34px;padding:6px 8px;border-color:transparent;background:transparent}td input:hover,td textarea:hover{border-color:var(--line)}td input:focus,td textarea:focus{border-color:var(--steel2);background:var(--card)}
.tablewrap{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:14px;background:var(--card)}
.grid{display:grid;gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat b{display:block;font:700 2rem var(--fd)}
.rep{display:grid;grid-template-columns:1fr auto;gap:10px}.opt{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px}.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.tag{display:inline-block;font:600 .72rem var(--fb);padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut)}.tag.red{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}.tag.green{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14212e;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9}
.empty{padding:40px;text-align:center;color:var(--mut)}
.skel{height:44px;border-radius:10px;background:linear-gradient(90deg,var(--soft) 25%,var(--card) 50%,var(--soft) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:8px 0}@keyframes sk{to{background-position:-200% 0}}
.drawer{position:fixed;inset:0 0 0 auto;width:min(640px,100%);background:var(--card);box-shadow:-12px 0 32px rgba(0,0,0,.2);padding:20px;overflow:auto;z-index:8}
.shade{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:7}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}aside .brand,aside .foot{display:none}.nav{white-space:nowrap;width:auto}main{padding:14px}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div id="root"><div class="empty">Đang tải…</div></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB=supabase.createClient(window.SS_CONFIG.SUPABASE_URL,window.SS_CONFIG.SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
const A={user:null,prof:null,tracks:[],track:null,view:'reports',counts:{},words:null,wq:'',wcat:'',dirty:{},reports:null,repTrack:'all',bank:null,sets:null,setSkill:'all',lessons:null,drawer:null};
const trackName=id=>A.tracks.find(t=>t.id===id)?.name||'—';
async function init(){const {data:{session}}=await SB.auth.getSession();A.user=session?.user||null;
 if(!A.user)return $('#root').innerHTML=`<div class="empty"><h1>SteelSpeak Admin</h1><p>Hãy đăng nhập trong app trước (cùng trình duyệt), rồi tải lại trang này.</p><a class="btn" href="./">Mở app để đăng nhập</a></div>`;
 const [p,t]=await Promise.all([SB.from('profiles').select('*').eq('id',A.user.id).maybeSingle(),SB.from('tracks').select('*').order('sort')]);A.prof=p.data;A.tracks=t.data||[];
 if(!A.prof?.is_admin)return $('#root').innerHTML=`<div class="empty"><h1>Không có quyền</h1><p>Tài khoản ${esc(A.user.email)} không phải admin.</p><a class="btn" href="./">Về app</a></div>`;
 try{A.track=localStorage.getItem('adm-track')}catch(e){}if(!A.tracks.some(t=>t.id===A.track))A.track=A.tracks[0]?.id;
 const h=location.hash.slice(1);if(h)A.view=h;await loadCounts();render()}
async function loadCounts(){const [r,l,w]=await Promise.all([SB.from('question_reports').select('id',{count:'exact',head:true}).eq('status','open'),SB.from('shared_lessons').select('id',{count:'exact',head:true}).eq('status','pending'),SB.from('word_suggestions').select('id',{count:'exact',head:true}).eq('status','review')]);A.counts={reports:r.count||0,lessons:l.count||0,sugg:w.count||0}}
const VIEWS=[['reports','⚑','Báo lỗi','reports'],['words','📚','Từ vựng'],['bank','❓','Ngân hàng câu hỏi'],['sets','🎓','Kho đề IELTS'],['lessons','↗','Bài học chờ duyệt','lessons']];
function go(v){A.view=v;location.hash=v;A.drawer=null;render()}
function setTrack(id){A.track=id;try{localStorage.setItem('adm-track',id)}catch(e){}A.words=null;A.bank=null;A.sets=null;A.lessons=null;A.dirty={};render()}
function render(){const v=VIEWS.find(x=>x[0]==A.view)||VIEWS[0];
 $('#root').innerHTML=`<div class="app"><aside><div class="brand">SteelSpeak<small>Quản trị nội dung</small></div>${VIEWS.map(([k,ic,n,c])=>`<button class="nav ${A.view==k?'on':''}" onclick="go('${k}')"><span aria-hidden="true">${ic}</span>${n}${c&&A.counts[c]?`<span class="badge" aria-label="${A.counts[c]} mục chờ">${A.counts[c]}</span>`:''}</button>`).join('')}<div class="foot">${esc(A.prof.full_name||A.user.email)}<br><a href="./">← Về app học</a></div></aside>
 <main><div class="top"><h1>${v[2]}</h1><span class="sp"></span>${A.view!='reports'?`<label class="small muted" for="trk">Khóa</label><select id="trk" style="width:auto" onchange="setTrack(this.value)">${A.tracks.map(t=>`<option value="${t.id}" ${t.id==A.track?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`:''}</div>${({reports:vReports,words:vWords,bank:vBank,sets:vSets,lessons:vLessons}[v[0]])()}</main></div>${A.drawer?`<div class="shade" onclick="A.drawer=null;render()"></div><div class="drawer" role="dialog" aria-modal="true">${A.drawer()}</div>`:''}`}
const skel='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';

/* ---------- Báo lỗi ---------- */
async function loadReports(){const {data}=await SB.from('question_reports').select('*').eq('status','open').order('id',{ascending:false}).limit(300);A.reports=data||[];render()}
function curAns(q){if(q.type=='order')return (q.items||[]).slice().sort((a,b)=>a.i-b.i).map(x=>x.t).join(' → ');return (q.opts||[])[q.ans]}
function vReports(){if(A.reports==null){loadReports();return skel}const L=A.reports.filter(r=>A.repTrack=='all'||r.track_id==A.repTrack);
 return `<p class="muted">Người học báo câu hỏi sai. Câu tự sinh trong Đua level lấy từ <b>từ vựng</b> của khóa: sửa từ gốc là sửa luôn câu hỏi.</p><div class="chips" style="margin:10px 0"><button class="chip ${A.repTrack=='all'?'on':''}" onclick="A.repTrack='all';render()">Tất cả (${A.reports.length})</button>${A.tracks.map(t=>{const n=A.reports.filter(r=>r.track_id==t.id).length;return n?`<button class="chip ${A.repTrack==t.id?'on':''}" onclick="A.repTrack='${t.id}';render()">${esc(t.name)} (${n})</button>`:''}).join('')}</div>
 ${!L.length?'<div class="card empty">🎉 Không còn báo lỗi nào chờ xử lý.</div>':`<div class="grid">${L.map(r=>{const q=r.question||{};const isI=!!q.ielts_set;return `<div class="card rep"><div><div class="row small muted"><span class="tag">${esc(trackName(r.track_id))}</span>${isI?`<span class="tag">IELTS ${esc(q.skill||'')} · đề #${q.ielts_set}</span>`:`<span class="tag">Level ${r.level||'?'}</span>`}${r.bank_id?`<span class="tag">Ngân hàng #${r.bank_id}</span>`:isI?'':'<span class="tag">Câu tự sinh</span>'}<span>${new Date(r.created_at).toLocaleString('vi-VN')}</span></div>
  <h3 style="margin:8px 0 6px;font-family:var(--fb);font-size:1.02rem">${esc(q.prompt||'')}</h3>${q.hint?`<div class="small muted">${esc(q.hint)}</div>`:''}
  ${q.opts?`<div class="grid" style="gap:6px;margin-top:8px">${q.opts.map((o,k)=>`<div class="opt ${k===q.ans?'ok':''}">${k===q.ans?'✓':'·'} ${esc(o)}</div>`).join('')}</div>`:q.items?`<div class="small" style="margin-top:6px">Thứ tự hiện tại: <b>${esc(curAns(q))}</b></div>`:''}
  ${r.note?`<p style="margin:8px 0 0"><span class="tag red">Người học</span> ${esc(r.note)}</p>`:''}</div>
  <div class="grid" style="align-content:start;min-width:170px">${isI?`<button class="btn" onclick="openSet(${q.ielts_set},${r.id})">Sửa đề</button>`:r.bank_id?`<button class="btn" onclick="openBank(${r.bank_id},${r.id})">Sửa câu hỏi</button>`:q.term?`<button class="btn" onclick="openWordByTerm('${r.track_id}',${esc(JSON.stringify(q.term))},${r.id})">Sửa từ gốc</button>`:''}<button class="btn ghost" onclick="repDone(${r.id},'fixed')">✓ Đã sửa</button><button class="btn danger" onclick="repDone(${r.id},'dismissed')">Bỏ qua</button></div></div>`}).join('')}</div>`}`}
async function repDone(id,st){const {error}=await SB.from('question_reports').update({status:st}).eq('id',id);if(error)return toast(error.message);A.reports=A.reports.filter(r=>r.id!==id);A.counts.reports=Math.max(0,(A.counts.reports||1)-1);A.drawer=null;toast(st=='fixed'?'Đã đánh dấu đã sửa':'Đã bỏ qua');render()}

/* ---------- Từ vựng ---------- */
async function loadWords(){const {data,error}=await SB.from('words').select('id,term,meaning_vi,example,example_vi,cat,cefr,status,ord').eq('track_id',A.track).order('ord').order('id').limit(5000);if(error)toast(error.message);A.words=data||[];render()}
function vWords(){if(A.words==null){loadWords();return skel}const tr=A.tracks.find(t=>t.id==A.track)||{};const cats=Object.entries(tr.cats||{});const q=A.wq.toLowerCase();
 const L=A.words.filter(w=>(!A.wcat||w.cat==A.wcat||w.cefr==A.wcat)&&(!q||(w.term+' '+w.meaning_vi+' '+w.example).toLowerCase().includes(q)));const nd=Object.keys(A.dirty).length;
 return `<div class="row" style="margin-bottom:10px"><input type="search" placeholder="Tìm từ, nghĩa, ví dụ…" value="${esc(A.wq)}" oninput="A.wq=this.value;clearTimeout(window._wt);window._wt=setTimeout(render,200)" style="max-width:320px" aria-label="Tìm từ vựng"><select style="width:auto" onchange="A.wcat=this.value;render()" aria-label="Lọc chủ đề"><option value="">Mọi chủ đề</option>${cats.map(([k,n])=>`<option value="${esc(k)}" ${A.wcat==k?'selected':''}>${esc(n)}</option>`).join('')}</select><span class="muted small">${L.length}/${A.words.length} từ</span><span style="flex:1"></span><button class="btn ghost" onclick="addWord()">＋ Thêm từ</button><button class="btn amber" ${nd?'':'disabled'} onclick="saveWords()">Lưu ${nd||''} thay đổi</button></div>
 <div class="tablewrap"><table><thead><tr><th style="width:18%">Từ / cụm từ</th><th style="width:18%">Nghĩa tiếng Việt</th><th>Ví dụ</th><th style="width:20%">Dịch ví dụ</th><th style="width:110px">Chủ đề</th><th style="width:90px">Trạng thái</th></tr></thead><tbody>${L.slice(0,400).map(w=>{const d=A.dirty[w.id]||{};const v=k=>esc(d[k]??w[k]??'');return `<tr class="${A.dirty[w.id]?'dirty':''}"><td><input value="${v('term')}" oninput="wEdit(${w.id},'term',this.value)" aria-label="Từ"></td><td><input value="${v('meaning_vi')}" oninput="wEdit(${w.id},'meaning_vi',this.value)" aria-label="Nghĩa"></td><td><textarea rows="2" oninput="wEdit(${w.id},'example',this.value)" aria-label="Ví dụ">${v('example')}</textarea></td><td><textarea rows="2" oninput="wEdit(${w.id},'example_vi',this.value)" aria-label="Dịch ví dụ">${v('example_vi')}</textarea></td><td><select onchange="wEdit(${w.id},'cat',this.value)" aria-label="Chủ đề">${cats.map(([k,n])=>`<option value="${esc(k)}" ${(d.cat??w.cat)==k?'selected':''}>${esc(n)}</option>`).join('')}</select></td><td><select onchange="wEdit(${w.id},'status',this.value)" aria-label="Trạng thái"><option value="approved" ${(d.status??w.status)=='approved'?'selected':''}>Dùng</option><option value="hidden" ${(d.status??w.status)=='hidden'?'selected':''}>Ẩn</option></select></td></tr>`}).join('')}</tbody></table>${L.length>400?'<div class="empty small">Hiện 400 từ đầu, hãy tìm để lọc thêm.</div>':''}</div>
 <p class="small muted">Lưu ý: câu cloze (điền từ) cần ví dụ chứa đúng từ đó. Từ “Ẩn” không xuất hiện trong bài học và Đua level.</p>`}
function wEdit(id,k,v){const w=A.words.find(x=>x.id==id);A.dirty[id]=A.dirty[id]||{};if(String(w[k]??'')===v)delete A.dirty[id][k];else A.dirty[id][k]=v;if(!Object.keys(A.dirty[id]).length)delete A.dirty[id];const tr=document.activeElement?.closest('tr');if(tr)tr.classList.toggle('dirty',!!A.dirty[id]);const b=[...document.querySelectorAll('.btn.amber')].find(b=>/^Lưu/.test(b.textContent));if(b){const n=Object.keys(A.dirty).length;b.disabled=!n;b.textContent='Lưu '+(n||'')+' thay đổi'}}
async function saveWords(){const ids=Object.keys(A.dirty);let ok=0;for(const id of ids){const {error}=await SB.from('words').update(A.dirty[id]).eq('id',id);if(error){toast('Lỗi từ #'+id+': '+error.message);continue}Object.assign(A.words.find(w=>w.id==id),A.dirty[id]);delete A.dirty[id];ok++}toast('Đã lưu '+ok+' từ');render()}
async function addWord(){const tr=A.tracks.find(t=>t.id==A.track);const cat=Object.keys(tr.cats||{})[0]||'misc';const term=prompt('Từ/cụm từ tiếng Anh mới:');if(!term)return;const {data,error}=await SB.from('words').insert({track_id:A.track,term:term.trim(),meaning_vi:'',example:'',example_vi:'',cat,status:'approved',source:'admin',ord:9999}).select().single();if(error)return toast(error.message);A.words.unshift(data);A.wq=term;render()}
async function openWordByTerm(trackId,term,repId){const {data}=await SB.from('words').select('*').eq('track_id',trackId).ilike('term',term).limit(1);const w=data?.[0];
 A.drawer=()=>w?`<h2>Sửa từ gốc</h2><p class="small muted">Câu hỏi tự sinh lấy nghĩa và ví dụ từ đây. Sửa xong, mọi câu dùng từ này sẽ đúng.</p><div class="grid"><label>Từ<input id="dw_term" value="${esc(w.term)}"></label><label>Nghĩa tiếng Việt<input id="dw_mean" value="${esc(w.meaning_vi)}"></label><label>Ví dụ (phải chứa đúng từ)<textarea id="dw_ex" rows="3">${esc(w.example)}</textarea></label><label>Dịch ví dụ<textarea id="dw_exvi" rows="2">${esc(w.example_vi)}</textarea></label><div class="row"><button class="btn" onclick="saveWordDrawer(${w.id},${repId})">Lưu & đánh dấu đã sửa</button><button class="btn ghost" onclick="A.drawer=null;render()">Đóng</button></div></div>`:`<h2>Không tìm thấy từ “${esc(term)}”</h2><p class="muted">Từ này có thể thuộc bộ từ có sẵn trong code (khóa Steel cũ). Liên hệ người phát triển để sửa.</p><button class="btn ghost" onclick="A.drawer=null;render()">Đóng</button>`;render()}
async function saveWordDrawer(id,repId){const patch={term:$('#dw_term').value.trim(),meaning_vi:$('#dw_mean').value.trim(),example:$('#dw_ex').value.trim(),example_vi:$('#dw_exvi').value.trim()};if(patch.example&&!patch.example.toLowerCase().includes(patch.term.toLowerCase().split(' (')[0]))if(!confirm('Ví dụ không chứa đúng từ, câu điền từ sẽ bị bỏ qua. Vẫn lưu?'))return;
 const {error}=await SB.from('words').update(patch).eq('id',id);if(error)return toast(error.message);A.words=null;await repDone(repId,'fixed')}

/* ---------- Ngân hàng câu hỏi ---------- */
async function loadBank(){const {data}=await SB.from('question_bank').select('*').eq('track_id',A.track).order('id',{ascending:false}).limit(1000);A.bank=data||[];render()}
function vBank(){if(A.bank==null){loadBank();return skel}
 return `<div class="row" style="margin-bottom:10px"><span class="muted">${A.bank.length} câu · trắc nghiệm được trộn 2 câu/level (trùm 3); câu <b>xếp thứ tự có gắn chương</b> thay cho quy trình mặc định của chương đó</span><span style="flex:1"></span><button class="btn" onclick="openBank(null)">＋ Thêm câu hỏi</button></div>
 <div class="tablewrap"><table><thead><tr><th>Câu hỏi</th><th style="width:30%">Đáp án đúng</th><th style="width:110px">Loại</th><th style="width:100px">Trạng thái</th><th style="width:80px"></th></tr></thead><tbody>${A.bank.map(q=>`<tr><td>${esc(q.prompt)}</td><td>${esc(q.type=='order'?q.options.join(' → '):q.options[q.answer])}</td><td><span class="tag">${q.type=='order'?'Thứ tự':'Trắc nghiệm'}</span>${q.cat?`<div class="small muted">${esc(((A.tracks.find(t=>t.id==A.track)||{}).cats||{})[q.cat]||q.cat)}</div>`:''}</td><td><span class="tag ${q.status=='live'?'green':''}">${q.status=='live'?'Đang dùng':q.status=='draft'?'Nháp':'Tắt'}</span></td><td><button class="btn ghost" onclick="openBank(${q.id})">Sửa</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Chưa có câu hỏi.</td></tr>'}</tbody></table></div>`}
async function openBank(id,repId){let q=id?(A.bank||[]).find(x=>x.id==id):null;if(id&&!q){const {data}=await SB.from('question_bank').select('*').eq('id',id).single();q=data}q=q?JSON.parse(JSON.stringify(q)):{type:'mcq',prompt:'',options:['','','',''],answer:0,explanation:'',level_min:1,status:'live',track_id:A.track};A._q=q;
 A.drawer=()=>{const q=A._q;const o=q.type=='order';return `<h2>${q.id?'Sửa câu hỏi #'+q.id:'Câu hỏi mới'}</h2><div class="grid" style="margin-top:10px"><div class="chips">${[['mcq','Trắc nghiệm'],['order','Xếp thứ tự']].map(([k,n])=>`<button class="chip ${q.type==k?'on':''}" onclick="bSync();A._q.type='${k}';render()">${n}</button>`).join('')}</div>
 <label>Câu hỏi<textarea id="bq_p" rows="2">${esc(q.prompt)}</textarea></label><div class="small muted">${o?'Các bước theo ĐÚNG thứ tự':'Chọn ◉ ở đáp án đúng'}</div><div class="grid" id="bq_o" style="gap:6px">${q.options.map((x,k)=>`<div class="row" style="flex-wrap:nowrap">${o?`<b style="width:22px">${k+1}</b>`:`<input type="radio" name="bq_a" value="${k}" ${q.answer==k?'checked':''} style="width:20px;min-height:20px" aria-label="Đáp án đúng">`}<input type="text" value="${esc(x)}"><button class="btn danger" aria-label="Xóa dòng" onclick="bSync();A._q.options.splice(${k},1);render()">✕</button></div>`).join('')}</div><button class="btn ghost" onclick="bSync();A._q.options.push('');render()">＋ Thêm dòng</button>
 <label>Giải thích (hiện khi sai)<input id="bq_e" value="${esc(q.explanation||'')}"></label><div class="row"><label style="flex:1">Chương<select id="bq_c"><option value="">Mọi chương</option>${Object.entries((A.tracks.find(t=>t.id==(q.track_id||A.track))||{}).cats||{}).map(([k,n])=>`<option value="${esc(k)}" ${q.cat==k?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label style="flex:1">Từ level<input id="bq_l" type="number" min="1" value="${q.level_min||1}"></label><label style="flex:1">Trạng thái<select id="bq_s"><option value="live" ${q.status=='live'?'selected':''}>Đang dùng</option><option value="draft" ${q.status=='draft'?'selected':''}>Nháp</option><option value="off" ${q.status=='off'?'selected':''}>Tắt</option></select></label></div>
 <div class="row"><button class="btn" onclick="saveBank(${repId||'null'})">Lưu${repId?' & đánh dấu đã sửa':''}</button><button class="btn ghost" onclick="A.drawer=null;render()">Đóng</button></div></div>`};render()}
function bSync(){const q=A._q;if(!$('#bq_p'))return;q.prompt=$('#bq_p').value.trim();q.options=[...document.querySelectorAll('#bq_o input[type=text]')].map(i=>i.value.trim());const r=document.querySelector('input[name=bq_a]:checked');if(r)q.answer=+r.value;q.explanation=$('#bq_e').value.trim();q.level_min=+$('#bq_l').value||1;q.cat=$('#bq_c').value||null;q.status=$('#bq_s').value}
async function saveBank(repId){bSync();const q=A._q;const opts=q.options.filter(Boolean);if(!q.prompt||opts.length<2)return toast('Cần câu hỏi và ít nhất 2 dòng');const row={track_id:q.track_id||A.track,type:q.type,prompt:q.prompt,options:opts,answer:q.type=='order'?null:Math.min(q.answer||0,opts.length-1),explanation:q.explanation,cat:q.cat||null,level_min:q.level_min,status:q.status,updated_at:new Date().toISOString()};
 const r=q.id?await SB.from('question_bank').update(row).eq('id',q.id):await SB.from('question_bank').insert({...row,source:'admin'});if(r.error)return toast(r.error.message);A.bank=null;toast('Đã lưu');if(repId)await repDone(repId,'fixed');else{A.drawer=null;render()}}

/* ---------- Kho đề IELTS ---------- */
const SKL={reading:'📖 Reading',listening:'🎧 Listening',wprompt:'✍️ Writing',sprompt:'🎙️ Speaking'};
async function loadSets(){const {data}=await SB.from('ielts_sets').select('id,skill,sub,topic,title,quality,status,uses,created_at').eq('track_id',A.track).order('id',{ascending:false}).limit(500);A.sets=data||[];render()}
function vSets(){if(A.sets==null){loadSets();return skel}const L=A.sets.filter(s=>A.setSkill=='all'||s.skill==A.setSkill);
 return `<div class="chips" style="margin-bottom:10px">${[['all','Tất cả'],...Object.entries(SKL)].map(([k,n])=>`<button class="chip ${A.setSkill==k?'on':''}" onclick="A.setSkill='${k}';render()">${n}</button>`).join('')}</div>
 <div class="tablewrap"><table><thead><tr><th>Đề</th><th style="width:130px">Kỹ năng</th><th style="width:140px">Chủ đề</th><th style="width:70px">Lượt</th><th style="width:220px"></th></tr></thead><tbody>${L.map(s=>`<tr style="${s.status=='off'?'opacity:.5':''}"><td>${s.quality?'⭐ ':''}${esc(s.title||'(không tên)')}</td><td>${SKL[s.skill]||s.skill}${s.sub?(s.skill=='wprompt'?' T':' P')+s.sub:''}</td><td>${esc(s.topic||'')}</td><td>${s.uses}</td><td class="row"><button class="btn ghost" onclick="openSet(${s.id})">Sửa</button><button class="btn ghost" onclick="setPatch(${s.id},{quality:${!s.quality}})">${s.quality?'Bỏ ⭐':'⭐'}</button><button class="btn ${s.status=='off'?'ghost':'danger'}" onclick="setPatch(${s.id},{status:'${s.status=='off'?'live':'off'}'})">${s.status=='off'?'Bật':'Tắt'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Chưa có đề nào.</td></tr>'}</tbody></table></div>`}
async function setPatch(id,p){const {error}=await SB.from('ielts_sets').update(p).eq('id',id);if(error)return toast(error.message);const s=(A.sets||[]).find(x=>x.id==id);if(s)Object.assign(s,p);render()}
async function openSet(id,repId){const {data:s,error}=await SB.from('ielts_sets').select('*').eq('id',id).single();if(error||!s)return toast('Không mở được đề #'+id);A._s=s;
 A.drawer=()=>{const s=A._s,D=s.data||{};const Q=D.questions||[];return `<h2>Đề #${s.id} · ${SKL[s.skill]||s.skill}</h2><p class="small muted">Sửa trực tiếp nội dung và đáp án. Người học gặp đề này lần sau sẽ thấy bản đã sửa.</p><div class="grid">
 ${D.title!=null?`<label>Tiêu đề<input id="sd_title" value="${esc(D.title)}"></label>`:''}${D.passage!=null?`<label>Bài đọc<textarea id="sd_pass" rows="10">${esc(D.passage)}</textarea></label>`:''}${D.prompt!=null?`<label>Đề bài<textarea id="sd_prompt" rows="6">${esc(D.prompt)}</textarea></label>`:''}
 ${D.script?`<label>Lời thoại (mỗi dòng: Người nói: câu)<textarea id="sd_script" rows="8">${esc(D.script.map(l=>l.who+': '+l.text).join('\n'))}</textarea></label>`:''}
 ${Q.length&&typeof Q[0]=='object'?`<h3>Câu hỏi</h3>${Q.map((q,i)=>`<div class="card grid" style="gap:6px"><label>Câu ${i+1}<input id="sq_${i}" value="${esc(q.q)}"></label>${q.type=='tfng'?`<label>Đáp án<select id="sa_${i}">${['TRUE','FALSE','NOT GIVEN'].map(v=>`<option ${String(q.answer).toUpperCase()==v?'selected':''}>${v}</option>`).join('')}</select></label>`:q.type=='gap'?`<label>Đáp án (1–3 từ)<input id="sa_${i}" value="${esc(q.answer)}"></label>`:`${(q.options||[]).map((o,k)=>`<div class="row" style="flex-wrap:nowrap"><input type="radio" name="sa_${i}" value="${k}" ${q.answer==k?'checked':''} style="width:20px;min-height:20px" aria-label="Đáp án đúng"><input id="so_${i}_${k}" value="${esc(o)}"></div>`).join('')}`}<label>Giải thích<input id="se_${i}" value="${esc(q.explain||'')}"></label></div>`).join('')}`:Q.length?`<label>Câu hỏi (mỗi dòng 1 câu)<textarea id="sd_qs" rows="4">${esc(Q.join('\n'))}</textarea></label>`:''}
 <div class="row"><label class="row" style="width:auto"><input type="checkbox" id="sd_q" ${s.quality?'checked':''} style="width:18px;min-height:18px"> ⭐ Đề chất lượng</label><label class="row" style="width:auto"><input type="checkbox" id="sd_off" ${s.status=='off'?'checked':''} style="width:18px;min-height:18px"> Tắt đề</label></div>
 <div class="row"><button class="btn" onclick="saveSet(${repId||'null'})">Lưu${repId?' & đánh dấu đã sửa':''}</button><button class="btn ghost" onclick="A.drawer=null;render()">Đóng</button></div></div>`};render()}
async function saveSet(repId){const s=A._s,D=JSON.parse(JSON.stringify(s.data||{}));const v=id=>document.getElementById(id);
 if(v('sd_title'))D.title=v('sd_title').value;if(v('sd_pass'))D.passage=v('sd_pass').value;if(v('sd_prompt'))D.prompt=v('sd_prompt').value;
 if(v('sd_script'))D.script=v('sd_script').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(':');return i>0?{who:l.slice(0,i).trim(),text:l.slice(i+1).trim()}:{who:'',text:l}});
 if(v('sd_qs'))D.questions=v('sd_qs').value.split('\n').map(x=>x.trim()).filter(Boolean);
 else (D.questions||[]).forEach((q,i)=>{if(typeof q!='object')return;q.q=v('sq_'+i).value;q.explain=v('se_'+i).value;if(q.type=='tfng'||q.type=='gap')q.answer=v('sa_'+i).value;else{q.options=(q.options||[]).map((o,k)=>v('so_'+i+'_'+k).value);const r=document.querySelector(`input[name=sa_${i}]:checked`);if(r)q.answer=+r.value}});
 const patch={data:D,title:D.title||s.title,quality:v('sd_q').checked,status:v('sd_off').checked?'off':'live'};const {error}=await SB.from('ielts_sets').update(patch).eq('id',s.id);if(error)return toast(error.message);A.sets=null;toast('Đã lưu đề');if(repId)await repDone(repId,'fixed');else{A.drawer=null;render()}}

/* ---------- Bài học chờ duyệt ---------- */
async function loadLessons(){const {data}=await SB.from('shared_lessons').select('*').eq('track_id',A.track).in('status',['pending','live']).order('status').order('id',{ascending:false});A.lessons=data||[];render()}
function vLessons(){if(A.lessons==null){loadLessons();return skel}if(!A.lessons.length)return '<div class="card empty">Chưa có bài học nào được chia sẻ trong khóa này.</div>';
 return `<div class="grid">${A.lessons.map(l=>`<div class="card"><div class="row"><h3 style="font-family:var(--fb);font-size:1.05rem">${esc(l.name)}</h3><span class="tag ${l.status=='live'?'green':'red'}">${l.status=='live'?'Đang hiện':'Chờ duyệt'}</span><span class="small muted">${esc(l.author||'')} · ${l.terms.length} từ</span><span style="flex:1"></span>${l.status=='pending'?`<button class="btn" onclick="lessonSet(${l.id},'live')">✓ Duyệt</button>`:''}<button class="btn danger" onclick="lessonSet(${l.id},'rejected')">${l.status=='live'?'Gỡ':'Từ chối'}</button></div>
 <details style="margin-top:8px"><summary class="small">Xem ${l.terms.length} từ</summary><div class="tablewrap" style="max-height:300px;margin-top:6px"><table><tbody>${l.terms.map(t=>`<tr><td><b>${esc(t.en)}</b></td><td>${esc(t.vi||'')}</td><td class="small muted">${esc(t.ex||'')}</td></tr>`).join('')}</tbody></table></div></details></div>`).join('')}</div>`}
async function lessonSet(id,st){const {error}=await SB.from('shared_lessons').update({status:st}).eq('id',id);if(error)return toast(error.message);await loadCounts();A.lessons=null;toast(st=='live'?'Đã duyệt':'Đã gỡ');render()}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==A.view){A.view=h;A.drawer=null;render()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&A.drawer){A.drawer=null;render()}});
init();
</script>
</body>
</html>
