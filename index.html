<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e79"><link rel="manifest" href="manifest.webmanifest">
<title>SteelSpeak TPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
/* Layout: one phone-width app column, coil-strip header, bottom tab bar; spec tab reads as a design brief */
:root{
--bg:#eef1f4;--card:#ffffff;--ink:#14212e;--mut:#5b6b7b;--line:#d7dee6;
--steel:#1f4e79;--steel2:#2f6ea8;--zinc:#a9b7c4;--amber:#e39b1a;--good:#1a7d4d;--bad:#c8433a;--soft:#e4ebf2;--warn:#946014;--onsteel:#ffffff;--brush:rgba(20,33,46,.035);--sheen:rgba(255,255,255,.18);
--fd:"Barlow Semi Condensed","Arial Narrow",sans-serif;--fb:"Be Vietnam Pro",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151c;--card:#16212c;--ink:#e6edf3;--mut:#93a4b5;--line:#253545;--steel:#5d9fdc;--steel2:#7bb6ea;--zinc:#4a5b6b;--amber:#f0b347;--good:#3fbf7f;--bad:#ec6a5f;--soft:#1d2b39;--warn:#f0b347;--onsteel:#0e151c;--brush:rgba(255,255,255,.025);--sheen:rgba(255,255,255,.22);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151c;--card:#16212c;--ink:#e6edf3;--mut:#93a4b5;--line:#253545;--steel:#5d9fdc;--steel2:#7bb6ea;--zinc:#4a5b6b;--amber:#f0b347;--good:#3fbf7f;--bad:#ec6a5f;--soft:#1d2b39;--warn:#f0b347;--onsteel:#0e151c;--brush:rgba(255,255,255,.025);--sheen:rgba(255,255,255,.22);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700}h2{font-size:1.35rem;font-weight:600;margin-top:22px}h3{font-size:1.05rem;font-weight:600}
.lbl{font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--mut);font-weight:600}
.mut{color:var(--mut)}.mono{font-family:var(--fm);font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coil{border-radius:18px;padding:18px;color:#fff;background:repeating-linear-gradient(100deg,#1b3f61 0 14px,#214b72 14px 28px);position:relative;overflow:hidden}
.coil::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:18px solid rgba(255,255,255,.12);box-shadow:inset 0 0 0 14px rgba(255,255,255,.06)}
.coil .lbl{color:#bcd3ea}.coil h1{color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}.stat b{font-family:var(--fd);font-size:1.4rem;display:block;font-variant-numeric:tabular-nums}.stat span{font-size:.75rem;color:#d4e3f2}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{background:var(--steel);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;text-align:center}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn.amber{background:var(--amber);color:#1a1205}
.btn:disabled{opacity:.5}
.path{display:flex;flex-direction:column;gap:0;margin-top:8px}
.node{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);text-align:left;width:100%}
.node i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--fd);font-weight:700;background:var(--soft);color:var(--steel)}
.node.done i{background:var(--good);color:#fff}.node.now i{background:var(--amber);color:#1a1205}
.chip{display:inline-block;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.82rem}
.chip.on{background:var(--steel);border-color:var(--steel);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.hscroll .chip{flex:none}
.term{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 12px}
.term .en{font-weight:600}.term .vi{font-size:.86rem;color:var(--mut)}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--steel)}
.ic svg{width:18px;height:18px}
.big{font-family:var(--fd);font-size:1.9rem;font-weight:700;text-align:center;line-height:1.1}
.flash{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.opt{width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.mic{width:84px;height:84px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;margin:6px auto}
.mic svg{width:34px;height:34px}.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--bad) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.w{display:inline-block;padding:1px 6px;border-radius:6px;margin:2px;font-weight:600}
.w.g{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}.w.m{background:color-mix(in srgb,var(--amber) 25%,transparent)}.w.b{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.score{font-family:var(--fd);font-size:3rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.gauge{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gauge div{background:var(--soft);border-radius:10px;padding:8px;text-align:center}.gauge b{font-family:var(--fd);font-size:1.3rem;display:block}
input[type=text],select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav>div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mut)}
nav button svg{width:22px;height:22px}nav button.on{color:var(--steel);font-weight:600}
.note{border-left:3px solid var(--amber);padding:8px 12px;background:var(--soft);border-radius:0 10px 10px 0;font-size:.86rem}
table{border-collapse:collapse;width:100%;font-size:.84rem}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}th{font-family:var(--fd);font-weight:600}
.tw{overflow-x:auto}
.layers div{padding:7px 12px;font-size:.84rem;border-radius:6px;margin-bottom:3px;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.85rem;z-index:9}

/* ===== Steel finish (SteelSpeak Design System) ===== */
body{background:repeating-linear-gradient(0deg,var(--brush) 0 1px,transparent 1px 3px),var(--bg)}
.btn{color:var(--onsteel);background:linear-gradient(180deg,var(--sheen),transparent 55%),var(--steel);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);transition:transform .15s ease-out,filter .15s ease-out;min-height:44px}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.btn.amber{color:#14212e;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 55%),var(--amber)}
.btn.ghost{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.chip{min-height:36px;padding:7px 12px;font-weight:500;transition:background .15s,color .15s}
.chip.on{color:var(--onsteel)}
.card{background:linear-gradient(180deg,var(--card),var(--card)) padding-box,linear-gradient(180deg,var(--zinc),var(--line) 40%) border-box;border:1px solid transparent}
.ic{background:linear-gradient(145deg,var(--card),var(--soft));box-shadow:inset 0 0 0 1px var(--line)}
.node i{background:linear-gradient(145deg,var(--card),var(--soft));box-shadow:inset 0 0 0 2px var(--zinc)}
.node.done i{background:var(--good);box-shadow:none}.node.now i{background:var(--amber);box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 25%,transparent)}
.coil{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3)}
.coil::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.10) 45%,transparent 60%);pointer-events:none}
.lbl{color:var(--mut)}
.bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}.bar i{background:linear-gradient(90deg,var(--amber),color-mix(in srgb,var(--amber) 70%,#fff))}
nav{background:linear-gradient(180deg,var(--card),var(--soft))}
nav button{position:relative;min-height:56px}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--steel)}
.mic{box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 4px 14px color-mix(in srgb,var(--bad) 35%,transparent)}
.w.m{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.btn,.chip{transition:none}}

/* ===== Flashcards ===== */
.fc-counts{display:flex;gap:10px;font-family:var(--fm);font-size:.9rem;font-weight:500}
.c-new{color:var(--steel)}.c-learn{color:var(--bad)}.c-rev{color:var(--good)}
.ic:disabled{opacity:.35}
.fc-stage{position:relative;margin-top:14px;perspective:1400px;height:min(62vh,440px)}
.fc-peek{position:absolute;inset:10px 10px -8px;border-radius:22px;background:var(--card);border:1px solid var(--line);transform:translateY(8px) scale(.97);opacity:.8}
.fc-peek2{transform:translateY(16px) scale(.94);opacity:.5}
.fc-card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer;touch-action:pan-y;user-select:none}
.fc-card.is-flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px 20px 76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
 background:linear-gradient(180deg,var(--card),var(--card)) padding-box,linear-gradient(160deg,var(--zinc),var(--line) 45%,var(--zinc)) border-box;border:1.5px solid transparent;box-shadow:0 10px 30px rgba(20,33,46,.10)}
.fc-front::before{content:"";position:absolute;inset:0;border-radius:22px;background:repeating-linear-gradient(0deg,var(--brush) 0 1px,transparent 1px 3px);pointer-events:none}
.fc-back{transform:rotateY(180deg)}
.fc-tag{position:absolute;top:16px;left:18px;font:600 .72rem/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.fc-term{font:700 clamp(1.8rem,8vw,2.6rem)/1.08 var(--fd);text-wrap:balance;overflow-wrap:anywhere}
.fc-vi{font:600 clamp(1.3rem,6vw,1.7rem)/1.2 var(--fb);text-wrap:balance}
.fc-ex{max-width:34ch;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.fc-hint{font-size:.8rem;position:absolute;bottom:70px}
.fc-speak{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.fc-stamp{position:absolute;top:24px;padding:6px 12px;border:3px solid;border-radius:10px;font:700 1.1rem/1 var(--fd);letter-spacing:.06em;opacity:0;transition:opacity .1s;backface-visibility:hidden}
.fc-stamp-l{right:20px;color:var(--bad);transform:rotate(12deg)}.fc-stamp-r{left:20px;color:var(--good);transform:rotate(-12deg)}
.is-flipped .fc-stamp{transform:rotateY(180deg)}
.swipe-l .fc-stamp-l,.swipe-r .fc-stamp-r{opacity:1}
.fc-grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.fc-grade{min-height:58px;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);transition:transform .12s}
.fc-grade:active{transform:scale(.96)}
.fc-grade b{font-family:var(--fd);font-size:1rem}.fc-grade span{font-size:.72rem;color:var(--mut);font-family:var(--fm)}
.fc-grade.g0 b{color:var(--bad)}.fc-grade.g1 b{color:var(--warn)}.fc-grade.g2 b{color:var(--good)}.fc-grade.g3 b{color:var(--steel)}
.fc-grade.g2{background:color-mix(in srgb,var(--good) 10%,var(--card));border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.fc-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.fc-sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:.78rem;color:var(--mut)}
.fc-sum b{display:block;font:700 1.5rem/1.1 var(--fd)}.fc-sum .g0 b{color:var(--bad)}.fc-sum .g1 b{color:var(--warn)}.fc-sum .g2 b{color:var(--good)}.fc-sum .g3 b{color:var(--steel)}
@media (prefers-reduced-motion:reduce){.fc-card{transition:none}}

/* Đưa thanh tab lên trên mọi lớp nổi chèn từ bên ngoài (VD: huy hiệu của nhà cung cấp hosting) */
nav{z-index:2147483647}
.toast{z-index:2147483647}

/* ===== Speed Saga ===== */
.saga-hero{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;color:#fff;padding:16px;border-radius:18px;background:linear-gradient(135deg,#7a3b16,#c9711c 55%,#e39b1a);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px rgba(201,113,28,.3)}
.saga-hero b{display:block;font:700 1.25rem/1.2 var(--fd)}.saga-hero span{font-size:.82rem;color:#ffeccc}
.saga-hero-go{flex:none;background:#fff;color:#7a3b16!important;font:700 .95rem var(--fd)!important;padding:10px 14px;border-radius:99px}
.saga-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.saga-tabs button{min-height:40px;border-radius:9px;font-weight:600;color:var(--mut)}.saga-tabs button.on{background:var(--card);color:var(--steel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.saga-bar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:10px 0;font-family:var(--fd);font-size:1rem}.saga-bar b{color:var(--amber);font-size:1.2rem}
.saga-map{position:relative;margin:0 -16px;overflow:hidden;border-radius:0}
.saga-band{position:absolute;left:0;right:0}
.saga-band-tex{position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px),radial-gradient(circle at 85% 20%,rgba(255,255,255,.12),transparent 40%)}
.saga-sign{position:absolute;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3);background:rgba(10,18,26,.55);color:#fff;font:700 1rem/1.1 var(--fd);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(2px)}
.saga-sign span{display:block;font:600 .68rem/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:#ffd58a;margin-bottom:3px}
.saga-path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.saga-path path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.saga-path .p1{stroke:rgba(0,0,0,.25);stroke-width:22px}.saga-path .p2{stroke:#d9e1e8;stroke-width:14px;stroke-dasharray:2 18}
.saga-node-wrap{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.saga-node{width:60px;height:60px;border-radius:50%;font:700 1.35rem/1 var(--fd);color:#fff;background:radial-gradient(circle at 35% 30%,#8fb6dc,#2f6ea8 45%,#163a5c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.4),0 4px 10px rgba(0,0,0,.35);border:3px solid #e8eef3;display:grid;place-items:center}
.saga-node.done{background:radial-gradient(circle at 35% 30%,#ffe2a1,#e39b1a 45%,#9a5f0a);color:#2a1600}
.saga-node.locked{background:radial-gradient(circle at 35% 30%,#c5ced6,#8796a4 50%,#5b6977);color:#eef2f5;border-color:#aab6c1;cursor:not-allowed}
.saga-node.locked svg{width:24px;height:24px}
.saga-node.cur{width:72px;height:72px;font-size:1.6rem;animation:sgpulse 1.6s infinite}
@keyframes sgpulse{0%,100%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.4),0 0 0 0 rgba(255,213,138,.8)}50%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.4),0 0 0 14px rgba(255,213,138,0)}}
.saga-stars{display:flex;gap:1px;margin-bottom:-6px;position:relative;z-index:1}.saga-stars i{font-style:normal;font-size:1.05rem;color:rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.5)}.saga-stars i.on{color:#ffcf4a}
.saga-stars i:nth-child(2){transform:translateY(-5px)}
.saga-stars.big i{font-size:2rem}.saga-stars.huge{justify-content:center;margin:8px 0}.saga-stars.huge i{font-size:3.4rem;animation:sgstar .5s both}
@keyframes sgstar{from{transform:scale(0) rotate(-30deg);opacity:0}to{opacity:1}}
.saga-me{position:absolute;right:-30px;top:-14px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--steel);display:grid;place-items:center;font:700 .8rem var(--fd);border:3px solid #ffcf4a;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.saga-friends{position:absolute;left:-40px;top:8px;display:flex}.saga-friends span{width:28px;height:28px;margin-left:-8px;border-radius:50%;background:#fff;color:#3b4a7a;font:700 .7rem/28px var(--fd);text-align:center;border:2px solid #9fb6d3;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.saga-modal{position:fixed;inset:0;z-index:2147483646;background:rgba(8,14,20,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.saga-sheet{width:100%;max-width:440px;background:var(--card);border-radius:22px;overflow:hidden;animation:sgup .25s ease-out}
@keyframes sgup{from{transform:translateY(30px);opacity:0}}
.saga-sheet-top{padding:18px;color:#fff;text-align:center}.saga-sheet-top h1{color:#fff;font-size:2.2rem}
.saga-goal{width:100%;font-size:.88rem}.saga-goal td:first-child{color:var(--warn);font-weight:700;width:52px;white-space:nowrap}
.saga-timer{font:500 1rem var(--fm);background:var(--soft);padding:4px 10px;border-radius:99px}
.saga-q{margin-top:10px}.saga-opts{display:grid;gap:8px;margin-top:12px}
.saga-ord{display:flex;gap:10px;align-items:center}.saga-ordn{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 .9rem var(--fd)}
.saga-ord.picked{border-color:var(--steel)}.saga-ord.picked .saga-ordn{background:var(--steel);color:var(--onsteel);border-color:var(--steel)}
.saga-stun{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--bad);color:#fff;font:700 1.1rem var(--fd);padding:14px 20px;border-radius:14px;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.saga-res{margin-top:12px;border-radius:22px;padding:20px;text-align:center;color:#fff;background:repeating-linear-gradient(100deg,#1b3f61 0 14px,#214b72 14px 28px)}
.saga-res h1{color:#fff;font-size:2rem}.saga-od{display:inline-block;background:#ffcf4a;color:#2a1600;font:700 .9rem var(--fd);padding:6px 12px;border-radius:99px;margin-bottom:8px}

function vRes(r){return `<div class="card stack"><div class="lbl">Kết quả</div><div class="score" style="color:${r.score>=80?'var(--good)':r.score>=60?'var(--warn)':'var(--bad)'}">${r.score}<span style="font-size:1.2rem">/100</span></div>
<div class="gauge"><div><b>${r.acc}</b><span class="mut" style="font-size:.75rem">Chính xác</span></div><div><b>${r.flu}</b><span class="mut" style="font-size:.75rem">Trôi chảy</span></div><div><b>${r.comp}</b><span class="mut" style="font-size:.75rem">Đầy đủ</span></div></div>
<div>${r.words.map(w=>`<span class="w ${w.s}">${esc(w.w)}</span>`).join(' ')}</div><div class="mut" style="font-size:.84rem">Bạn nói: “${esc(r.heard)}”${r.sim?' · <b>kết quả mô phỏng</b>':''}</div>
<div class="note">${r.tip}</div></div>`}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return d[b.length]}
function grade(target,heard,conf,sim){const T=norm(target),H=norm(heard);const words=T.map(w=>{let best=Math.min(...H.map(h=>lev(w,h)/Math.max(w.length,h.length)),1);return{w,s:best==0?'g':best<.4?'m':'b',v:1-best}});
const acc=Math.round(words.reduce((a,w)=>a+w.v,0)/words.length*100);const comp=Math.round(Math.min(H.length/T.length,1)*100);const flu=Math.round(Math.max(40,Math.min(100,(conf||.8)*100)));
const score=Math.round(acc*.6+flu*.2+comp*.2);const bad=words.filter(w=>w.s!='g').map(w=>w.w);
const tip=bad.length?`Luyện lại: <b>${bad.join(', ')}</b>. Nghe chế độ chậm, nhấn đúng trọng âm rồi đọc lại.`+(bad.some(w=>/th/.test(w))?' Âm /θ/ trong “th”: đặt đầu lưỡi giữa hai hàm răng.':'')+(bad.some(w=>/(s|t|d|k)$/.test(w))?' Đừng nuốt âm cuối (s, t, d, k), lỗi hay gặp của người Việt.':''):'Rất tốt! Phát âm rõ, đủ âm cuối. +10 XP';return{score,acc,flu,comp,words,heard,tip,sim}}
function listen(){const t=S.spMode=='sent'?S.speakItem.ex:S.speakItem.en;const b=$('#micb'),st=$('#mst');
const simulate=()=>{const T=norm(t);const heard=T.map((w,i)=>i%3==1&&w.length>3?w.slice(0,-1):w).join(' ');S.res=grade(t,heard,.78,true);render()};
if(!SR){b.classList.add('rec');st.textContent='Đang mô phỏng…';return setTimeout(simulate,1200)}
try{const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;b.classList.add('rec');st.textContent='Đang nghe… hãy đọc to và rõ';
r.onresult=e=>{const a=e.results[0][0];S.res=grade(t,a.transcript,a.confidence,false);const it=S.speakItem;if(S.res.score>=70){S.xp+=10;hit(it)}else miss(it);tick();save();render()};
r.onerror=()=>{st.textContent='Micro bị chặn ở đây, hiển thị kết quả mô phỏng.';setTimeout(simulate,700)};r.onend=()=>b.classList.remove('rec');r.start()}catch(e){simulate()}}

function lib(src,g){return new Promise((ok,no)=>{if(window[g])return ok(window[g]);const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[g]);s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
async function readDoc(f){if(!f)return;const st=$('#dst');st.textContent='Đang đọc “'+f.name+'”…';try{let text='';const ext=f.name.split('.').pop().toLowerCase();
if(ext=='pdf'){await lib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js','pdfjsWorker');const P=await lib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib');
const pdf=await P.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=Math.min(pdf.numPages,30);i++){const c=await (await pdf.getPage(i)).getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n'}}
else if(ext=='docx'){const M=await lib('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js','mammoth');text=(await M.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
else text=await f.text();
text=text.replace(/\s+/g,' ').trim();if(text.length<80){st.textContent='Không đọc được chữ trong file này (có thể là bản scan). Hãy dán văn bản vào ô bên dưới.';return}
DOC={name:f.name,text};$('#paste').value=text.slice(0,4000)+(text.length>4000?' …':'');st.textContent=`Đã đọc ${text.split(' ').length.toLocaleString('vi')} từ. Bấm “AI tạo bài học”.`}catch(e){st.textContent='Không mở được file. Thử lưu sang .txt hoặc dán nội dung vào ô bên dưới.'}}
async function buildFromDoc(){const st=$('#dst'),b=$('#bld');const pasted=$('#paste').value.trim();const text=(DOC.text&&pasted.endsWith('…')?DOC.text:pasted).slice(0,14000);const name=DOC.text?DOC.name:'Văn bản dán';
if(text.length<80)return st.textContent='Cần ít nhất vài câu tiếng Anh để AI tạo bài.';b.disabled=true;st.textContent='AI đang đọc tài liệu và soạn bài…';
try{const n=+$('#cnt').value;const r=await ai('lesson',{text,n});
const terms=(r.terms||[]).filter(x=>x&&x.en&&x.vi).slice(0,n).map(x=>({en:String(x.en),vi:String(x.vi),ex:String(x.ex||''),exvi:String(x.exvi||''),cat:'doc'}));if(terms.length<4)throw 0;
const l={id:'d'+Date.now(),name:r.title||('Bài từ '+name),src:name,mode:'quiz',n:terms.length,cats:['doc'],terms};S.lessons.unshift(l);save();st.textContent='';toast('Đã tạo bài “'+l.name+'”');start(l)}
catch(e){st.textContent=e&&e.code=='rate_limited'?'AI đang bận, thử lại sau ít phút.':e&&e.code=='login'?'Hãy đăng nhập ở trang Học trước khi dùng AI.':'AI chưa tạo được bài. Thử đoạn văn ngắn hơn hoặc rõ hơn.'}finally{b.disabled=false}}

function sceneSVG(ci,h,theme){const LST=THEME_SCN[theme]||SCN,S0=LST[ci%LST.length],W=400;let r=rng2(ci*977+13+(theme||'').length*31),o='';

 if(S0.night)for(let k=0;k<(S0.stars||40);k++)o+=`<circle class="twk" style="--d:${(k%7)*0.4}s" cx="${r()*W}" cy="${r()*h*0.7}" r="${0.8+r()*1.6}" fill="#fff"/>`;
 else{o+=`<circle cx="${ci%2?330:70}" cy="60" r="28" fill="#fff6c2" opacity=".9"/>`;for(let k=0;k<3;k++){const cy=40+k*(h/3.2),cx=r()*W;o+=`<g class="cloud" style="--d:${k*-12}s;--s:${38+k*10}s"><g transform="translate(${cx} ${cy})"><ellipse rx="34" ry="12" fill="#fff" opacity=".85"/><ellipse cx="-14" cy="-8" rx="16" ry="12" fill="#fff" opacity=".85"/><ellipse cx="10" cy="-12" rx="18" ry="14" fill="#fff" opacity=".85"/></g></g>`}}
 for(let k=0;k<3;k++){const y=h*(0.3+k*0.28);o+=`<path d="M-20 ${y+60} Q ${W*0.25} ${y-10} ${W*0.5} ${y+40} T ${W+20} ${y+20} V ${h} H -20z" fill="${S0.hill[k%2]}" opacity="${0.55+k*0.15}"/>`}
 if(S0.bush!==false)for(let k=0;k<10;k++){const left=k%2==0;const x=left?16+r()*40:W-16-r()*40,y=60+k*(h-90)/10;o+=`<g transform="translate(${x} ${y})"><circle r="${9+r()*6}" fill="${S0.hill[1]}"/><circle cx="8" cy="3" r="${7+r()*4}" fill="${S0.hill[0]}"/></g>`}
 S0.props.forEach((p,k)=>{const left=k%2==0;const x=left?34+r()*26:W-34-r()*26,y=h*(0.22+k*0.2);o+=prop(p,x,y,0.9+r()*0.3,k)});

function rng2(s){let a=s>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

 if(error){TERMS=tr.slug=='steel'?STEEL_TERMS:[];return}
 Object.entries(tr.cats||{}).forEach(([k,v])=>{if(!CATS[k])CATS[k]={n:v,e:'',d:''};else CATS[k].n=v});

async function saReview(id,ok){const lv=$('#sal'+id)?.value;const {error}=await SB.rpc('admin_review_suggestion',{sid:id,approve:ok,final_level:lv,final_meaning:null});if(error)return toast(error.message);toast(ok?'Đã thêm vào kho từ':'Đã từ chối');SA.list=null;render()}
/* admin đổi tên khóa học nhanh */
function renameTrack(id){const tr=TR.tracks.find(x=>x.id==id);const m=document.createElement('div');m.className='saga-modal';m.innerHTML=`<div class="saga-sheet stack" style="padding:18px" role="dialog" aria-label="Đổi tên khóa học"><h3>Đổi tên khóa học</h3><label class="lbl" for="rnm">Tên mới</label><input type="text" id="rnm" value="${esc(tr.name)}" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit"><div class="row" style="flex-wrap:nowrap"><button class="btn" style="flex:1" id="rnok">Lưu tên</button><button class="btn ghost" id="rnx">Huỷ</button></div><div id="rnst" class="mut" style="font-size:.84rem"></div></div>`;
 document.body.appendChild(m);const inpEl=m.querySelector('#rnm');inpEl.focus();inpEl.select();m.querySelector('#rnx').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
 m.querySelector('#rnok').onclick=async()=>{const name=inpEl.value.trim();if(!name)return;const {error}=await SB.from('tracks').update({name}).eq('id',id);if(error){m.querySelector('#rnst').textContent='Chưa lưu được: '+error.message;return}tr.name=name;m.remove();toast('Đã đổi tên khóa học');render()}}

/* ===================== TRÙM KAKA (nhân vật gốc, phong cách Yakuza Nhật Bản) ===================== */
function kakaMaleSVG(state){const down=state=='down';return `<span class="kaka-pic male ${down?'is-down':''}" role="img" aria-label="Kaka, trùm kiếm sĩ song kiếm${down?' đã bị hạ':''}"><img src="assets/kaka_m.png" alt="" draggable="false"><i class="kaka-glint"></i>${down?'<b class="kaka-ok">✓</b>':''}</span>`}
function kakaSVG(state){const down=state=='down';return `<span class="kaka-pic ${down?'is-down':''}" role="img" aria-label="Kaka, trùm kiếm sĩ${down?' đã bị hạ':''}"><img src="assets/kaka.png" alt="" draggable="false"><i class="kaka-glint"></i>${down?'<b class="kaka-ok">✓</b>':''}</span>`}

render();boot();
