<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e79"><link rel="manifest" href="manifest.webmanifest">
<title>SteelSpeak TPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
/* Layout: one phone-width app column, coil-strip header, bottom tab bar; spec tab reads as a design brief */
:root{
--bg:#eef1f4;--card:#ffffff;--ink:#14212e;--mut:#5b6b7b;--line:#d7dee6;
--steel:#1f4e79;--steel2:#2f6ea8;--zinc:#a9b7c4;--amber:#e39b1a;--good:#1d8a55;--bad:#c8433a;--soft:#e4ebf2;
--fd:"Barlow Semi Condensed","Arial Narrow",sans-serif;--fb:"Be Vietnam Pro",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151c;--card:#16212c;--ink:#e6edf3;--mut:#93a4b5;--line:#253545;--steel:#5d9fdc;--steel2:#7bb6ea;--zinc:#4a5b6b;--amber:#f0b347;--good:#3fbf7f;--bad:#ec6a5f;--soft:#1d2b39;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151c;--card:#16212c;--ink:#e6edf3;--mut:#93a4b5;--line:#253545;--steel:#5d9fdc;--steel2:#7bb6ea;--zinc:#4a5b6b;--amber:#f0b347;--good:#3fbf7f;--bad:#ec6a5f;--soft:#1d2b39;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700}h2{font-size:1.35rem;font-weight:600;margin-top:22px}h3{font-size:1.05rem;font-weight:600}
.lbl{font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--mut);font-weight:600}
.mut{color:var(--mut)}.mono{font-family:var(--fm);font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coil{border-radius:18px;padding:18px;color:#fff;background:repeating-linear-gradient(100deg,#1b3f61 0 14px,#214b72 14px 28px);position:relative;overflow:hidden}
.coil::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:18px solid rgba(255,255,255,.12);box-shadow:inset 0 0 0 14px rgba(255,255,255,.06)}
.coil .lbl{color:#bcd3ea}.coil h1{color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}.stat b{font-family:var(--fd);font-size:1.4rem;display:block;font-variant-numeric:tabular-nums}.stat span{font-size:.75rem;color:#d4e3f2}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{background:var(--steel);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;text-align:center}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn.amber{background:var(--amber);color:#1a1205}
.btn:disabled{opacity:.5}
.path{display:flex;flex-direction:column;gap:0;margin-top:8px}
.node{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);text-align:left;width:100%}
.node i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--fd);font-weight:700;background:var(--soft);color:var(--steel)}
.node.done i{background:var(--good);color:#fff}.node.now i{background:var(--amber);color:#1a1205}
.chip{display:inline-block;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.82rem}
.chip.on{background:var(--steel);border-color:var(--steel);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.hscroll .chip{flex:none}
.term{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 12px}
.term .en{font-weight:600}.term .vi{font-size:.86rem;color:var(--mut)}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--steel)}
.ic svg{width:18px;height:18px}
.big{font-family:var(--fd);font-size:1.9rem;font-weight:700;text-align:center;line-height:1.1}
.flash{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.opt{width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.mic{width:84px;height:84px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;margin:6px auto}
.mic svg{width:34px;height:34px}.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--bad) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.w{display:inline-block;padding:1px 6px;border-radius:6px;margin:2px;font-weight:600}
.w.g{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}.w.m{background:color-mix(in srgb,var(--amber) 25%,transparent)}.w.b{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.score{font-family:var(--fd);font-size:3rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.gauge{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gauge div{background:var(--soft);border-radius:10px;padding:8px;text-align:center}.gauge b{font-family:var(--fd);font-size:1.3rem;display:block}
input[type=text],select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav>div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mut)}
nav button svg{width:22px;height:22px}nav button.on{color:var(--steel);font-weight:600}
.note{border-left:3px solid var(--amber);padding:8px 12px;background:var(--soft);border-radius:0 10px 10px 0;font-size:.86rem}
table{border-collapse:collapse;width:100%;font-size:.84rem}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}th{font-family:var(--fd);font-weight:600}
.tw{overflow-x:auto}
.layers div{padding:7px 12px;font-size:.84rem;border-radius:6px;margin-bottom:3px;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.85rem;z-index:9}
</style>

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function vSpeak(){const t=S.speakItem||TERMS.find(x=>x.en=='Mill Test Certificate (MTC)')||TERMS[17];S.speakItem=t;const mode=S.spMode||'term';const target=mode=='term'?t.en:t.ex;
return `<h1>Luyện phát âm AI</h1><p class="mut">Nghe mẫu giọng Mỹ, rồi bấm mic và đọc lại. AI chấm từng từ.</p>
<div class="chips" style="margin:10px 0"><button class="chip ${mode=='term'?'on':''}" onclick="S.spMode='term';S.res=null;render()">Thuật ngữ</button><button class="chip ${mode=='sent'?'on':''}" onclick="S.spMode='sent';S.res=null;render()">Câu ví dụ</button><button class="chip" onclick="S.speakItem=TERMS[Math.floor(Math.random()*TERMS.length)];S.res=null;render()">Đổi từ ngẫu nhiên</button></div>
<div class="card flash" style="min-height:180px"><div class="lbl">${CATS[t.cat].n}</div><div class="big" style="font-size:${mode=='term'?'1.8rem':'1.25rem'}">${esc(target)}</div><div class="mut">${esc(mode=='term'?t.vi:t.exvi)}</div><div class="row">${spk(target)}${slow(target)}</div></div>
<button class="mic" id="micb" aria-label="Bắt đầu ghi âm" onclick="listen()">${svg('mic')}</button><p class="mut" style="text-align:center;font-size:.84rem" id="mst">${SR?'Chạm để đọc':'Trình duyệt này không mở được micro. Đang dùng chế độ mô phỏng để xem kết quả mẫu.'}</p>
${S.res?vRes(S.res):''}`}
function vRes(r){return `<div class="card stack"><div class="lbl">Kết quả</div><div class="score" style="color:${r.score>=80?'var(--good)':r.score>=60?'var(--amber)':'var(--bad)'}">${r.score}<span style="font-size:1.2rem">/100</span></div>
<div class="gauge"><div><b>${r.acc}</b><span class="mut" style="font-size:.75rem">Chính xác</span></div><div><b>${r.flu}</b><span class="mut" style="font-size:.75rem">Trôi chảy</span></div><div><b>${r.comp}</b><span class="mut" style="font-size:.75rem">Đầy đủ</span></div></div>
<div>${r.words.map(w=>`<span class="w ${w.s}">${esc(w.w)}</span>`).join(' ')}</div><div class="mut" style="font-size:.84rem">Bạn nói: “${esc(r.heard)}”${r.sim?' · <b>kết quả mô phỏng</b>':''}</div>
<div class="note">${r.tip}</div></div>`}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return d[b.length]}
function grade(target,heard,conf,sim){const T=norm(target),H=norm(heard);const words=T.map(w=>{let best=Math.min(...H.map(h=>lev(w,h)/Math.max(w.length,h.length)),1);return{w,s:best==0?'g':best<.4?'m':'b',v:1-best}});
const acc=Math.round(words.reduce((a,w)=>a+w.v,0)/words.length*100);const comp=Math.round(Math.min(H.length/T.length,1)*100);const flu=Math.round(Math.max(40,Math.min(100,(conf||.8)*100)));
const score=Math.round(acc*.6+flu*.2+comp*.2);const bad=words.filter(w=>w.s!='g').map(w=>w.w);
const tip=bad.length?`Luyện lại: <b>${bad.join(', ')}</b>. Nghe chế độ chậm, nhấn đúng trọng âm rồi đọc lại.`+(bad.some(w=>/th/.test(w))?' Âm /θ/ trong “th”: đặt đầu lưỡi giữa hai hàm răng.':'')+(bad.some(w=>/(s|t|d|k)$/.test(w))?' Đừng nuốt âm cuối (s, t, d, k), lỗi hay gặp của người Việt.':''):'Rất tốt! Phát âm rõ, đủ âm cuối. +10 XP';return{score,acc,flu,comp,words,heard,tip,sim}}
function listen(){const t=S.spMode=='sent'?S.speakItem.ex:S.speakItem.en;const b=$('#micb'),st=$('#mst');
const simulate=()=>{const T=norm(t);const heard=T.map((w,i)=>i%3==1&&w.length>3?w.slice(0,-1):w).join(' ');S.res=grade(t,heard,.78,true);render()};
if(!SR){b.classList.add('rec');st.textContent='Đang mô phỏng…';return setTimeout(simulate,1200)}
try{const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;b.classList.add('rec');st.textContent='Đang nghe… hãy đọc to và rõ';
r.onresult=e=>{const a=e.results[0][0];S.res=grade(t,a.transcript,a.confidence,false);const it=S.speakItem;if(S.res.score>=70){S.xp+=10;hit(it)}else miss(it);tick();save();render()};
r.onerror=()=>{st.textContent='Micro bị chặn ở đây, hiển thị kết quả mô phỏng.';setTimeout(simulate,700)};r.onend=()=>b.classList.remove('rec');r.start()}catch(e){simulate()}}
/* ---- custom lesson builder ---- */
let D={name:'',cats:['qual'],mode:'quiz',n:8,theme:''};
function vMake(){return `<h1>Tạo bài học riêng</h1><p class="mut">Chọn chủ đề, kiểu chơi và bối cảnh công việc thật của bạn.</p>
<div class="stack" style="margin-top:12px"><label class="lbl" for="nm">Tên bài</label><input type="text" id="nm" placeholder="VD: Chuẩn bị họp CFT duyệt NSPE" value="${esc(D.name)}" oninput="D.name=this.value">
<div class="lbl">Chủ đề (chọn nhiều)</div><div class="chips">${Object.entries(CATS).map(([k,c])=>`<button class="chip ${D.cats.includes(k)?'on':''}" onclick="D.cats=D.cats.includes('${k}')?D.cats.filter(x=>x!='${k}'):[...D.cats,'${k}'];render()">${c.n}</button>`).join('')}</div>

<label class="lbl" for="th">Bối cảnh tình huống (AI dựng hội thoại)</label><textarea id="th" rows="2" placeholder="VD: Khách hàng nhà xưởng ở Bình Dương báo màu tấm lợp lệch so với mẫu duyệt" oninput="D.theme=this.value">${esc(D.theme)}</textarea>
<button class="btn" onclick="saveLesson()">Lưu & bắt đầu</button><button class="btn ghost" onclick="aiScene()">✨ AI viết hội thoại mẫu từ bối cảnh</button><div id="scene"></div></div>
<h2 id="up">Tạo bài từ tài liệu</h2><p class="mut">Tải lên tài liệu tiếng Anh (spec, tiêu chuẩn, email, báo cáo test…). AI đọc, chọn thuật ngữ quan trọng, dịch và tạo bài học.</p>
<div class="stack"><label class="btn ghost" for="file" style="display:block">Chọn file .pdf, .docx, .txt</label><input type="file" id="file" accept=".pdf,.docx,.txt,.md" hidden onchange="readDoc(this.files[0])">
<textarea id="paste" rows="4" placeholder="…hoặc dán đoạn văn bản tiếng Anh vào đây"></textarea>
<div class="row"><label class="lbl" for="cnt">Số thuật ngữ</label><select id="cnt" style="width:auto"><option>8</option><option selected>12</option><option>20</option></select></div>
<button class="btn" id="bld" onclick="buildFromDoc()">✨ AI tạo bài học</button><div id="dst" class="mut" style="font-size:.86rem"></div></div>`}
let DOC={name:'',text:''};
function lib(src,g){return new Promise((ok,no)=>{if(window[g])return ok(window[g]);const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[g]);s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
async function readDoc(f){if(!f)return;const st=$('#dst');st.textContent='Đang đọc “'+f.name+'”…';try{let text='';const ext=f.name.split('.').pop().toLowerCase();
if(ext=='pdf'){await lib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js','pdfjsWorker');const P=await lib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib');
const pdf=await P.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=Math.min(pdf.numPages,30);i++){const c=await (await pdf.getPage(i)).getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n'}}
else if(ext=='docx'){const M=await lib('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js','mammoth');text=(await M.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
else text=await f.text();
text=text.replace(/\s+/g,' ').trim();if(text.length<80){st.textContent='Không đọc được chữ trong file này (có thể là bản scan). Hãy dán văn bản vào ô bên dưới.';return}
DOC={name:f.name,text};$('#paste').value=text.slice(0,4000)+(text.length>4000?' …':'');st.textContent=`Đã đọc ${text.split(' ').length.toLocaleString('vi')} từ. Bấm “AI tạo bài học”.`}catch(e){st.textContent='Không mở được file. Thử lưu sang .txt hoặc dán nội dung vào ô bên dưới.'}}
async function buildFromDoc(){const st=$('#dst'),b=$('#bld');const pasted=$('#paste').value.trim();const text=(DOC.text&&pasted.endsWith('…')?DOC.text:pasted).slice(0,14000);const name=DOC.text?DOC.name:'Văn bản dán';
if(text.length<80)return st.textContent='Cần ít nhất vài câu tiếng Anh để AI tạo bài.';b.disabled=true;st.textContent='AI đang đọc tài liệu và soạn bài…';
try{const n=+$('#cnt').value;const r=await ai('lesson',{text,n});
const terms=(r.terms||[]).filter(x=>x&&x.en&&x.vi).slice(0,n).map(x=>({en:String(x.en),vi:String(x.vi),ex:String(x.ex||''),exvi:String(x.exvi||''),cat:'doc'}));if(terms.length<4)throw 0;
const l={id:'d'+Date.now(),name:r.title||('Bài từ '+name),src:name,mode:'quiz',n:terms.length,cats:['doc'],terms};S.lessons.unshift(l);save();st.textContent='';toast('Đã tạo bài “'+l.name+'”');start(l)}
catch(e){st.textContent=e&&e.code=='rate_limited'?'AI đang bận, thử lại sau ít phút.':e&&e.code=='login'?'Hãy đăng nhập ở trang Học trước khi dùng AI.':'AI chưa tạo được bài. Thử đoạn văn ngắn hơn hoặc rõ hơn.'}finally{b.disabled=false}}
function saveLesson(){if(!D.cats.length)return toast('Chọn ít nhất một chủ đề');const l={...D,name:D.name||('Bài '+D.cats.map(c=>CATS[c].n).join(' + '))};S.lessons.unshift(l);save();toast('Đã lưu bài học');start(l)}
async function aiScene(){const box=$('#scene');const th=D.theme||'Khách hàng hỏi về khối lượng lớp mạ AZ150 trên chứng chỉ MTC';const words=TERMS.filter(t=>D.cats.includes(t.cat)).sort(()=>Math.random()-.5).slice(0,6).map(t=>t.en);
box.innerHTML='<div class="card mut">AI đang viết…</div>';try{const r=await ai('scene',{context:th,words});box.innerHTML=sceneHtml(r.lines,false)}catch(e){box.innerHTML=(e.code=='login'?'<p class="note">Đăng nhập ở trang Học để AI viết hội thoại riêng. Dưới đây là bản mẫu.</p>':'')+sceneHtml(demoScene(words),true)}}
function demoScene(w){return[{who:'Customer',en:'We found white rust on the GI coils after two weeks in our warehouse.',vi:'Chúng tôi thấy gỉ trắng trên cuộn GI sau hai tuần trong kho.'},{who:'TPL',en:`Thanks for reporting it. Could you send photos and the coil numbers so we can check traceability?`,vi:'Cảm ơn anh đã báo. Anh gửi giúp ảnh và số cuộn để bên em truy xuất nguồn gốc nhé?'},{who:'Customer',en:'Sure. Was the chemical treatment applied correctly?',vi:'Được. Lớp xử lý hóa học có được thực hiện đúng không?'},{who:'TPL',en:'We will review the Mill Test Certificate and the coating mass for that batch.',vi:'Bên em sẽ xem lại chứng chỉ MTC và khối lượng lớp mạ của lô đó.'},{who:'TPL',en:'Meanwhile, please store the coils in a dry, ventilated area.',vi:'Trong lúc đó, anh vui lòng để cuộn ở nơi khô ráo, thoáng khí.'}]}
function sceneHtml(L,demo){return `<div class="card stack"><div class="lbl">Hội thoại nhập vai${demo?' · bản mẫu':''}</div>${L.map(l=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="chip ${l.who=='TPL'?'on':''}" style="flex:none">${esc(l.who)}</span><div style="flex:1;min-width:0"><b>${esc(l.en)}</b><div class="mut" style="font-size:.84rem">${esc(l.vi)}</div></div>${spk(l.en)}</div>`).join('')}</div>`}

function vGame(){const g=S.game,t=g.pool[g.i];if(!t)return vDone();const m=g.l.mode;const top=`<button class="mut" onclick="S.game=null;render()">← Thoát</button><div class="row" style="margin:8px 0;flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${g.i/g.pool.length*100}%"></i></div><span class="mono">${g.i+1}/${g.pool.length}</span></div><div class="lbl">${esc(g.l.name)} · ${modeName(m)}</div>`;
if(m=='flash')return top+`<button class="card flash" style="width:100%;margin-top:10px" onclick="S.game.flip=!S.game.flip;render()">${g.flip?`<div class="big" style="font-size:1.4rem">${esc(t.vi)}</div><i>${esc(t.ex)}</i><div class="mut">${esc(t.exvi)}</div>`:`<div class="big">${esc(t.en)}</div><div class="mut">Chạm để lật</div>`}<div class="row">${spk(g.flip?t.ex:t.en)}</div></button>
<div class="row" style="margin-top:12px;flex-wrap:nowrap"><button class="btn ghost" style="flex:1" onclick="nx(0)">Chưa nhớ</button><button class="btn" style="flex:1" onclick="nx(1)">Đã nhớ</button></div>`;
if(m=='speak'){S.speakItem=t;S.spMode='term';return top+`<div class="card flash" style="margin-top:10px"><div class="big">${esc(t.en)}</div><div class="mut">${esc(t.vi)}</div><div class="row">${spk(t.en)}${slow(t.en)}</div></div><button class="mic" id="micb" onclick="listen()">${svg('mic')}</button><p class="mut" id="mst" style="text-align:center">Chạm để đọc</p>${S.res?vRes(S.res):''}<button class="btn" style="width:100%" onclick="nx(S.res&&S.res.score>=70?1:0)">Tiếp →</button>`}
if(!g.opts){const o=TERMS.filter(x=>x!==t).sort(()=>Math.random()-.5).slice(0,3);g.opts=[t,...o].sort(()=>Math.random()-.5)}
const optSrc=g.l.terms&&g.l.terms.length>=4?g.l.terms:TERMS;if(g.l.terms&&!g.optsFix){g.opts=[t,...optSrc.filter(x=>x.en!==t.en).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);g.optsFix=1}
const q=m=='listen'?`<div class="card flash" style="min-height:160px;margin-top:10px"><div class="mut">Nghe và chọn nghĩa đúng</div><button class="mic" style="background:var(--steel)" onclick="say(${esc(JSON.stringify(t.en))})">${svg('spk')}</button></div>`:`<div class="card flash" style="min-height:150px;margin-top:10px"><div class="mut">Chọn nghĩa tiếng Việt đúng</div><div class="big">${esc(t.en)}</div>${spk(t.en)}</div>`;
return top+q+`<div class="stack" style="margin-top:12px">${g.opts.map((o,k)=>`<button class="opt ${g.ans!=null?(o===t?'ok':k===g.ans?'no':''):''}" onclick="pick(${k})" ${g.ans!=null?'disabled':''}>${esc(o.vi)}</button>`).join('')}</div>${g.ans!=null?`<div class="card" style="margin-top:10px"><b>${esc(t.en)}</b> · <i>${esc(t.ex)}</i></div><button class="btn" style="width:100%;margin-top:10px" onclick="nx(S.game.opts[S.game.ans]===S.game.pool[S.game.i]?1:0)">Tiếp →</button>`:''}`}
function pick(k){const g=S.game;g.ans=k;const ok=g.opts[k]===g.pool[g.i];if(ok){say(g.pool[g.i].en)}render()}
function nx(ok){const g=S.game,t=g.pool[g.i];ok?hit(t):miss(t);g.ok+=ok;g.i++;g.flip=false;g.ans=null;g.opts=null;g.optsFix=0;S.res=null;save();render()}
function vDone(){const g=S.game;const xp=g.ok*10,pass=g.ok/g.pool.length>=.7;if(!g.paid){S.xp+=xp;g.paid=1;tick();if(pass&&g.l.path)S.done[g.l.path]=1;save()}return `<div class="coil" style="text-align:center;margin-top:20px"><div class="lbl">Hoàn thành</div><h1>${g.ok}/${g.pool.length} đúng</h1><p>+${xp} XP${g.l.path?(pass?' · Đã mở khóa chặng tiếp theo':' · Cần đúng 70% để qua chặng'):''}</p></div>${Object.keys(S.wrong).length?`<p class="mut" style="text-align:center">Các từ sai đã được thêm vào Sổ từ sai (${Object.keys(S.wrong).length} từ).</p>`:''}<div class="stack" style="margin-top:14px"><button class="btn" onclick="start(S.game.l)">Chơi lại</button><button class="btn ghost" onclick="S.game=null;render()">Về trang chính</button></div>`}
render();boot();
</script></body></html>
